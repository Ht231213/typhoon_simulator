; ============================================================================
;  台风图标方案 · default（简单圆圈）
; ============================================================================
;  用户 2026-10-30 定：方案拆两套
;    · default  = 旧版的「简单圆圈」（本方案，纯白圆环+白盘，颜色由强度渐变色负责）
;    · smcy13   = SMCY1.3 图标库抽出来的那套（外圈云系旋转 + 内圈数字）
;  ⚠ 这两套是**互斥的两种视觉方案**，千万不要混用（不要在同一屏同时出现渲染圈和 SMCY 图标）。
;
;  简单方案只有 generic 一张图：所有强度档都映射到它，
;  强度差异靠 shader 的「连续强度着色」（见 PathLayer.icon_tint_for / B2/B3）体现。
; ============================================================================

[meta]

; 外圈旋转角速度（度/秒）。简单圆环本身是旋转对称的，这个值看不出差别，
; 但保持和 SMCY 一致，免得以后换成带纹理的外圈时忘了。
rotation_deg_per_sec=72.0

canvas=256

; 图标世界直径 = 0.8 × 地图格子短边（CELL_W=67.5 → 54 px）
world_diameter=54

