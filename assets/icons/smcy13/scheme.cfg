; ============================================================================
;  台风图标方案 · default（随包分发的默认方案）
; ============================================================================
;  一个「方案」= 一个文件夹，里面是若干 <档位>_outer.png + <档位>_inner.png。
;
;  ⚠ 两张贴图**必须是同样的画布尺寸**（默认 256x256）：运行时同一位置、同一尺寸绘制，
;    外圈按下面的转速旋转、内圈完全不动。这样不需要记录每档的「内圈比例」，
;    自定义方案只要给两张同尺寸图就行。
;
;  素材来源：用户提供的 SMCY1.3 图标库（mainicon/），由 ffmpeg 抽第 0 帧后
;    · 外圈：黑底按「亮度 → alpha」抠成透明 + 中心挖孔
;    · 内圈：圆形遮罩（白盘不透明）
;    详见 docs/研究/06-台风图标素材清点.md 与同目录 README.md。
; ============================================================================

[meta]

; 外圈旋转角速度（度/秒）。实测：300 帧 = 5.0 秒一圈 → 72°/s。
; 北半球逆时针 = +72；南半球顺时针 = -72（运行时按台风所在半球取符号）。
rotation_deg_per_sec=72.0

; 用视频播图标（用户 2026-10-30）：真实素材里外圈两条弧线转速不同、中心还有两条，
; PNG 两层分解丢掉了这些差异 → 改成播 `video/<档位>.ogv`（19 档，合计约 4.2 MB）。
; PNG 那套保留作为回退（web 版不支持 Theora 视频时会用到）。
video=1

; 一张贴图的画布边长（像素）
canvas=256

; 图标在地图世界坐标里的默认直径（像素）。
; 地图逻辑尺寸 1080x864 对应 100°x80° → 1° ≈ 10.8 px；100 px ≈ 9.3° ≈ 1030 km。

[category]

; 游戏内强度分类 → 档位名（档位名就是文件名前缀）。
; 某个档位缺贴图时：先回退 default 方案的同档 → 再回退 generic；
; 整个方案都不存在时直接用 default 方案。
;
; ⚠ 1.2.0 起图标**优先**走下面的 [form] 15 档（更细，和参考工程一致）；
;    这一段保留给「没写 [form] 段的自定义方案」兜底，也保证老方案不改也能用。
unknown="db"
weak="db"
disturbance="db"
depression="db"
tropical_storm="ts"
c1="c1"
c2="c2"
c3="c3"
c4="c4"
c5="c5"
extratropical="ex"

[form]

; 图标「形态」15 档 → 档位名（1.2.0，档位表见 docs/参考_图标伪代码.md §3）。
; 数字含义：1=已转温带（不可逆）、2=14–25kt、3=24–34、4=33–64、5=63–83、
;   6=82–96、7=95–113、8=112–137、9=136–155、10=154–170、
;   11=169–200（★开始变亮蓝）、12=199–300、13=消散、14=>299、15=0–15kt 残涡。
;
; 我们这批素材比参考的 6 个族更细（有 C2-/C3-/C4+/C6 变体），所以按强度对齐得比较细：
1="ex"
2="db"
3="db"
4="ts"
5="ts"
6="c1"
7="c2"
8="c3"
9="c4"
10="c4"
11="c5"
12="c5"
13="generic"
14="c5"
15="generic"

; 方案里另外带了一批「备用档位」，以后强度体系扩展、或想细分时可以直接改上面的映射：
;   ts_plus   TS+（强热带风暴偏强）
;   c2_minus  C2-、c3_minus  C3-、c4_plus  C4+（同级的偏弱/偏强变体）
;   c6 / c6_plus / c6_max   C6 档（注意：素材的 C6 内圈带闪电，见 README）
;   db_alt / td_md          扰动的另一个变体 / 季风低压
;   ex_sd / ex_ss / ex_ultra 温带变性的其它形态
;   generic  通用型（无数字，白环）
