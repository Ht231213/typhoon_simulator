; ============================================================================
;  登陆特效方案 · default（简单圆圈标记）
; ============================================================================
;  和图标方案一一对应：default = 简单圆圈，smcy13 = SMCY1.3 素材。
;  目前游戏里登陆特效还是程序化画的两圈扩散弧（PathLayer.spawn_landfall_effect），
;  这套素材留给后续「特效方案」接入（等 Lead 确认 C13 用哪种）。
; ============================================================================

[meta]

; 单张标记的像素尺寸（素材本身）
marker_size=40

; 标记在地图里显示的世界尺寸（像素）
world_size=26

; 淡出时长（秒）与结束时的放大倍数（程序里按这个做缩放+淡出）
fade_seconds=1.4
fade_scale=2.2

[category]

unknown=""
weak=""
disturbance="marker"
depression="marker"
tropical_storm="marker"
c1="marker"
c2="marker"
c3="marker"
c4="marker"
c5="marker"
extratropical="marker"
