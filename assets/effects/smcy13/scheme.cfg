; ============================================================================
;  登陆特效方案 · default（随包分发的默认方案）
; ============================================================================
;  一个「方案」= 一个文件夹。V1 只用到「登陆标记贴图」：
;    台风登陆瞬间在地图那个位置显示一个标记，放大 + 淡出。
;  以后可以把「冲击动画」也放进同一方案（impact_<档位>.ogv / 序列帧），
;  缺任何东西都回退默认方案，不报错。
;
;  素材来源：用户提供的 SMCY1.3 图标库 landfall/landfall_*.png（40x40，带 alpha）
; ============================================================================

[meta]

; 标记贴图的原始尺寸（像素，仅作参考；运行时按下面的 world_size 缩放）
marker_size=40

; 标记在地图世界坐标里的初始直径（像素）
world_size=26

; 播放时长（秒）：从 world_size 放大到 world_size*fade_scale，同时淡出
fade_seconds=1.4
fade_scale=2.2

[category]

; 游戏内强度分类 → 标记文件名（<名字>.png）。留空 / 缺文件 = 该分类不额外画标记。
; 缺某个档时回退 default 方案的同档。
unknown=""
weak=""
disturbance=""
depression="td"
tropical_storm="ts"
c1="c1"
c2="c2"
c3="c3"
c4="c4"
c5="c5"
extratropical=""

; 方案里另外带了 sts / top / supertop / bsc 四个素材，暂未映射，留给以后细分类。
