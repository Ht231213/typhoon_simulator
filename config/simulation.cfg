; ============================================================================
;  Typhoon —— 仿真基础参数（节拍）
; ============================================================================
;
;  这是**仿真的基础节拍**，和玩家设置完全分开：
;    · 本文件   = 设计参数，随游戏发布，启动时读取
;    · user://settings.cfg = 玩家设置（音量 / 全屏），运行时保存
;
;  改这里**不需要改代码**，重启游戏即可生效。
;
;  导出成 exe 之后如果还想调：把本文件复制一份到 **exe 同目录**下，改名成
;  `simulation.cfg`，它里面的值会**覆盖**打包在游戏里的这一份。
;
;  ⚠⚠ 改帧率会直接影响强度平衡 ⚠⚠
;      强度循环是「每 tick 加一次 ΔKt」，所以帧率越高，每模拟日加的次数越多、
;      台风涨得越快。参考工程（Scratch / TurboWarp）默认只有 30 fps，
;      它的 `wait(0.01)` 实际约一帧，所以真实速率就是 30 次/秒 —— 下面用的 30。
;
;      实测（Kt=100、海温 30℃、暖池）：
;         30 fps → 每模拟日 120 tick → +26.3 kt/日
;         60 fps → 每模拟日 240 tick → +52.5 kt/日
;        100 fps → 每模拟日 400 tick → +87.6 kt/日   ← 早期误用的值，快了 3.33 倍
;
;  按 tick 计数的派生量（TICKS_PER_DAY、降温间隔、风切变游走间隔…）
;  都会在启动时按这里的值自动换算，不用你手算。
; ============================================================================

[timing]

; 物理帧率（Hz）。对应 Godot 的 physics_ticks_per_second。
; 30 = 参考工程的真实速率（推荐）；60 = 时间更平滑但强度涨得更快；100 = 早期误用的值。
physics_ticks_per_second=30

; 1 模拟日 = 多少真实秒。越小时间过得越快（台风移动和日期推进都会跟着变快）。
seconds_per_day=4.0

; 没有活跃台风时的「空闲加速」：1 模拟日 = 多少真实秒。
; ⚠ 0.5 是**用户手动调过的值**（原来是 1.0），别再改回 1.0。
seconds_per_day_idle=0.5

; 冷水坑「降温 / 回升」的执行间隔（秒）。越小降得越猛。
; 参考原文是每个循环都扣，实测 -9℃/秒 会把海温直接抠穿，所以降到了 2 次/秒。
cooling_apply_interval_seconds=0.5

; 垂直风切变随机游走的间隔（秒）。
shear_walk_interval_seconds=0.1


; ============================================================================
;  海洋
; ============================================================================
[ocean]

; 台风被判定在【陆地】上时，用的「有效海温」（℃）。
;
; 为什么需要这个：参考工程用「海温 ≤ 10℃」来标记陆地格，但它只填了 50°N 以北的三行，
; 中国 / 中南半岛 / 印度的陆地格仍然是 27~30℃ 的暖海值 —— 原始工程的遗漏。
; 结果台风上陆以后海温项照样 +40 kt/日，把 -0.5/tick 的陆地惩罚几乎抵消，
; 实测近岸只有 -9.4 kt/日（用户吐槽「陆地减弱太慢」）。
;
; 本工程用 WPAC_LAND.png 逐像素判定陆地（6 km，比那张 700 km 的表细 110 倍），
; 判定在陆地上时就把海温换成这个值。
;
; ⭐ 默认 26.5 = SST_EFFECT_BASE（参考的基准海温）→ 海温项**恰好归零**，
;    减弱完全由参考自己的 -0.5/tick 陆地惩罚驱动。这不是魔数，是「陆地上没有
;    海洋热源」的自然表达。想更快就调小，更温和就调大。
;
; 实测（100 kt 起跑、8 月、无风切变、非山区、东海近岸，单位 kt）：
;     land_sst    第1天   第2天   第3天
;       20.0      46.4      0       0      太快（1 天内归零）
;       24.0      57.4      5.3      0
;       26.5      64.6     22.4      0      ← 默认；首日 -35，约 3 天消散
;       27.5      67.4     29.9      0
;   对照：修复前是 5 天才从 100 掉到 52.9（-9.4/日），太慢。
;   现实：100 kt（C3）登陆后 24 小时内降为热带风暴，1~2 天消散。
land_sst=26.5


; ----------------------------------------------------------------------------
;  浅海热库上限（治「近岸像远洋一样增强」）
; ----------------------------------------------------------------------------
; 近岸浅海的暖水层被海底封顶 → 可提取的热量少 → 撑不起超强台风。
; 水深档由 WPAC_SHELF20/50/100.png **逐像素**判定（6.3 km/px，比 700 km 的 192 格细 110 倍）。
;
; 依据：海洋热含量 OHC ≈ 0.41 × (海温−26) × 暖水层厚度（kJ/cm²）
;   暖水层 20 m / 30℃ → 33 kJ/cm²，低于快速增强门槛(50~60) → 撑不起强台风
;   暖水层 50 m / 30℃ → 82 kJ/cm²，能到 C2 左右
;   暖水层 100m / 30℃ → 164 kJ/cm²，完全支持
;
; 生效方式：台风强度**超过**对应上限时，禁止继续增强，并按超出量往下拽。
; 低于上限时照常能增强（现实里浅海也常爆发，不能一刀切）。
;
; ⚠ 用户 2026-10-17 明确要求：**不加移速调制**，不因为走得快就放宽上限。
shelf_cap_100m=140
shelf_cap_50m=110
shelf_cap_20m=80

; 超过上限后每 tick 往下拽的系数。
; 0.004 → 超出 50 kt 时约 −24 kt/模拟日；调大=回落更快，调小=更拖。
shelf_excess_pull=0.004


; ----------------------------------------------------------------------------
;  陆地指数衰减（**本工程对参考的改写**）
; ----------------------------------------------------------------------------
; 参考原文只有一句 `ΔKt -= 0.5`（山区再 -1），是**线性**扣减 → 越弱掉得越快，
; 会一路崩到 0。现实是指数衰减、趋于一个背景强度：
;
;     V(t) = Vb + (V0 − Vb) · e^(−t/τ)
;
; 现实标定（docs/研究/01 第 ⑥ 节）：
;   Kaplan–DeMaria(1995) τ=10.5h → 100 kt 登陆 +24h 只剩 33 kt
;   NHC 经验「24h 内减半」        → 50 kt
;   近三十年变慢到 τ=40~70h       → 64~69 kt   ← 用户提的「+24h 剩 70」是这一档
;   → 真实范围 −30 ~ −65 kt/24h
;
; 用 τ=22h 的结果：100 kt → +12h 69 → +24h 51 → +48h 33 → 渐近 26.7（对齐研究的分档表）
;   强台风那档也对了：150 kt → +24h 约 70 kt（线性版本会剩 98，明显偏慢）
;
; τ 按地形分三档（研究结论：地形 > 移速 > 土壤湿度）：
;   平地 22h ｜ 1000m 山区 12h ｜ 2500m 高山 9h
;   2500m 那档专门复现「穿过台湾中央山脉 / 吕宋高山」的急降。
; 想整体更快就把 τ 调小；想更温和就调大。

; 上陆后强度指数式趋近的背景值（kt）。台风残涡在内陆大概就是这个量级。
land_decay_bg_kt=26.7

; 时间尺度 τ（小时）
land_decay_tau_plain=22
land_decay_tau_mountain=12
land_decay_tau_mountain2500=9

